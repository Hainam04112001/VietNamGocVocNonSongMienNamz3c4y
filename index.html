<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Video Full - Có Âm Thanh</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Gesture -->
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <script>
        // 🎬 XỬ LÝ VIDEO + ÂM THANH
        AFRAME.registerComponent('videohandler', {
            init: function () {
                var marker = this.el;
                this.vid = document.querySelector("#vid");

                marker.addEventListener('markerFound', () => {
                    this.vid.muted = false;   // 🔥 bật âm thanh
                    this.vid.play();
                });

                marker.addEventListener('markerLost', () => {
                    this.vid.pause();
                });
            }
        });

        // 📐 FIX TỈ LỆ VIDEO KHÔNG MÉO
        AFRAME.registerComponent('fit-video', {
            init: function () {
                const video = document.querySelector("#vid");
                const el = this.el;

                video.addEventListener('loadedmetadata', function () {
                    const ratio = video.videoWidth / video.videoHeight;

                    const width = 3; // chỉnh kích thước video tại đây

                    el.setAttribute('width', width);
                    el.setAttribute('height', width / ratio);
                });
            }
        });

        // 🔊 BẮT BUỘC CLICK ĐỂ BẬT ÂM THANH (mobile)
        document.addEventListener('click', function () {
            const video = document.querySelector("#vid");
            video.muted = false;
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">

    <a-scene
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        gesture-detector
    >

        <!-- VIDEO -->
        <a-assets>
            <video
                id="vid"
                src="assets/asset.mp4"
                preload="auto"
                loop
                crossorigin="anonymous"
                webkit-playsinline
                playsinline
            ></video>
        </a-assets>

        <!-- MARKER -->
        <a-marker
            type="pattern"
            url="assets/marker.patt"
            videohandler
            emitevents="true"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
        >

            <!-- VIDEO HIỂN THỊ -->
            <a-video
                src="#vid"
                fit-video
                position="0 0.1 0"
                rotation="-90 0 0"
                gesture-handler
            ></a-video>

        </a-marker>

        <!-- CAMERA -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
