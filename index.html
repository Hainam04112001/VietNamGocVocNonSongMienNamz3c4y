<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Multi Books PRO</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <script>
        // 🎬 VIDEO HANDLER
        AFRAME.registerComponent('videohandler', {
            init: function () {
                const marker = this.el;
                const videoElement = marker.querySelector('a-video');
                if (!videoElement) return;
                
                this.videoSelector = videoElement.getAttribute('src');
                this.video = document.querySelector(this.videoSelector);

                marker.addEventListener('markerFound', () => {
                    document.querySelectorAll("video").forEach(v => {
                        v.pause();
                        v.muted = true;
                    });
                    if (this.video) {
                        this.video.muted = false;
                        this.video.play().catch(e => console.log("Playback blocked:", e));
                    }
                });

                marker.addEventListener('markerLost', () => {
                    if (this.video) {
                        this.video.pause();
                        this.video.muted = true;
                    }
                });
            }
        });

        // 📐 FIT VIDEO
        AFRAME.registerComponent('fit-video', {
            init: function () {
                const video = document.querySelector(this.el.getAttribute('src'));
                const el = this.el;
                const setSize = () => {
                    if (video && video.videoWidth && video.videoHeight) {
                        const ratio = video.videoWidth / video.videoHeight;
                        const baseWidth = 3; 
                        el.setAttribute('width', baseWidth);
                        el.setAttribute('height', baseWidth / ratio);
                    } else {
                        setTimeout(setSize, 200);
                    }
                };
                setSize();
            }
        });

        // 🔥 CHỖ CẦN FIX: Thay đổi logic tính toán để không treo camera
        AFRAME.registerComponent('anti-shake', {
            init: function () {
                this.prevPos = new THREE.Vector3();
                this.prevQuat = new THREE.Quaternion(); // Dùng Quaternion thay vì Euler để tránh đứng máy
                this.firstTick = true;
            },
            tick: function () {
                const obj = this.el.object3D;
                if (this.firstTick) {
                    this.prevPos.copy(obj.position);
                    this.prevQuat.copy(obj.quaternion);
                    this.firstTick = false;
                    return;
                }
                // Nội suy (Lerp) vị trí và góc xoay mượt mà
                obj.position.lerp(this.prevPos, 0.1);
                obj.quaternion.slerp(this.prevQuat, 0.1); 
                
                this.prevPos.copy(obj.position);
                this.prevQuat.copy(obj.quaternion);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            // Cho phép âm thanh khi người dùng click lần đầu vào màn hình
            document.body.addEventListener('click', function() {
                const vids = document.querySelectorAll("video");
                vids.forEach(v => {
                    v.muted = false;
                });
            }, { once: true });

            const vids = document.querySelectorAll("video");
            vids.forEach(v => {
                v.muted = true;
                v.setAttribute("playsinline", "");
                v.setAttribute("webkit-playsinline", "");
            });
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">
    <div style="position: fixed; top: 10px; width: 100%; text-align: center; z-index: 10; color: white; font-family: sans-serif; pointer-events: none;">
        Chạm màn hình để bật âm thanh
    </div>

    <a-scene 
        embedded 
        vr-mode-ui="enabled: false" 
        loading-screen="enabled: false" 
        renderer="logarithmicDepthBuffer: true; precision: medium;" 
        arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false; detectionMode: mono_and_matrix;"
    >
        <a-assets>
            <video id="vid1" src="assets/asset.mp4" preload="auto" loop crossorigin="anonymous"></video>
            <video id="vid2" src="assets/sach1.mp4" preload="auto" loop crossorigin="anonymous"></video>
            <video id="vid3" src="assets/sach2.mp4" preload="auto" loop crossorigin="anonymous"></video>
            <video id="vid4" src="assets/sach3.mp4" preload="auto" loop crossorigin="anonymous"></video>
            <video id="vid5" src="assets/sach4.mp4" preload="auto" loop crossorigin="anonymous"></video>
            <video id="vid6" src="assets/sach5.mp4" preload="auto" loop crossorigin="anonymous"></video>
        </a-assets>

        <a-marker type="pattern" url="assets/marker.patt" videohandler smooth="true" smoothCount="10">
            <a-video src="#vid1" rotation="-90 0 0" fit-video anti-shake></a-video>
        </a-marker>

        <a-marker type="pattern" url="assets/marker1.patt" videohandler smooth="true" smoothCount="10">
            <a-video src="#vid2" rotation="-90 0 0" fit-video anti-shake></a-video>
        </a-marker>

        <a-marker type="pattern" url="assets/marker2.patt" videohandler smooth="true" smoothCount="10">
            <a-video src="#vid3" rotation="-90 0 0" fit-video anti-shake></a-video>
        </a-marker>

        <a-marker type="pattern" url="assets/marker3.patt" videohandler smooth="true" smoothCount="10">
            <a-video src="#vid4" rotation="-90 0 0" fit-video anti-shake></a-video>
        </a-marker>

        <a-marker type="pattern" url="assets/marker4.patt" videohandler smooth="true" smoothCount="10">
            <a-video src="#vid5" rotation="-90 0 0" fit-video anti-shake></a-video>
        </a-marker>

        <a-marker type="pattern" url="assets/marker5.patt" videohandler smooth="true" smoothCount="10">
            <a-video src="#vid6" rotation="-90 0 0" fit-video anti-shake></a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
