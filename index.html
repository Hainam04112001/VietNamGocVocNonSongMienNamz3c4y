<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Video Audio</title>

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
        let audioUnlocked = false;

        AFRAME.registerComponent('videohandler', {
            init: function () {
                const marker = this.el;
                const video = document.querySelector("#vid");

                marker.addEventListener('markerFound', () => {

                    if (audioUnlocked) {
                        video.muted = false;
                    }

                    video.play().catch(err => {
                        console.log("Play error:", err);
                    });
                });

                marker.addEventListener('markerLost', () => {
                    video.pause();
                });
            }
        });

        window.addEventListener("load", () => {

            const btn = document.getElementById("unlockAudio");

            btn.addEventListener("click", () => {

                const video = document.querySelector("#vid");

                video.muted = false;

                video.play()
                    .then(() => {

                        audioUnlocked = true;

                        video.pause();
                        video.currentTime = 0;

                        btn.style.display = "none";

                        console.log("Audio unlocked");

                    })
                    .catch(err => {
                        console.log(err);
                    });
            });

        });
    </script>
</head>

<body style="margin:0;overflow:hidden;">

    <!-- Nút bật âm thanh -->
    <button
        id="unlockAudio"
        style="
            position:fixed;
            z-index:9999;
            top:20px;
            left:20px;
            padding:12px 20px;
            font-size:16px;
        ">
        🔊 Bật âm thanh
    </button>

    <a-scene
        embedded
        vr-mode-ui="enabled:false"
        loading-screen="enabled:false"
        arjs="sourceType:webcam; debugUIEnabled:false;"
    >

        <a-assets>
            <video
                id="vid"
                src="assets/asset7.mp4"
                preload="auto"
                loop
                muted
                playsinline
                webkit-playsinline
                crossorigin="anonymous">
            </video>
        </a-assets>

        <a-marker
            type="pattern"
            url="assets/marker7.patt"
            videohandler
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5">

            <a-video
                src="#vid"
                position="0 0.1 0"
                rotation="-90 0 0"
                width="2"
                height="1.125">
            </a-video>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
