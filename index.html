<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Multi Books PRO</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Gesture -->
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <script>
        // 🎬 VIDEO HANDLER (multi video chuẩn)
        AFRAME.registerComponent('videohandler', {
            init: function () {
                const marker = this.el;
                this.videoEl = marker.querySelector("a-video");
                this.vid = document.querySelector(this.videoEl.getAttribute("src"));

                marker.addEventListener('markerFound', () => {
                    this.vid.muted = false;
                    this.vid.play();
                });

                marker.addEventListener('markerLost', () => {
                    this.vid.pause();
                });
            }
        });

        // 📐 FIX TỈ LỆ VIDEO (KHÔNG MÉO)
        AFRAME.registerComponent('fit-video', {
            init: function () {
                const src = this.el.getAttribute('src');
                const video = document.querySelector(src);
                const el = this.el;

                const setSize = () => {
                    if (video.videoWidth && video.videoHeight) {
                        const ratio = video.videoWidth / video.videoHeight;
                        const width = 3; // chỉnh kích thước tại đây

                        el.setAttribute('width', width);
                        el.setAttribute('height', width / ratio);
                    } else {
                        setTimeout(setSize, 200);
                    }
                };

                setSize();
            }
        });

        // 🔥 CHỐNG RUNG
        AFRAME.registerComponent('anti-shake', {
            init: function () {
                this.prevPos = new THREE.Vector3();
                this.prevRot = new THREE.Euler();
            },
            tick: function () {
                const obj = this.el.object3D;

                obj.position.lerp(this.prevPos, 0.1);

                obj.rotation.x = obj.rotation.x * 0.9 + this.prevRot.x * 0.1;
                obj.rotation.y = obj.rotation.y * 0.9 + this.prevRot.y * 0.1;
                obj.rotation.z = obj.rotation.z * 0.9 + this.prevRot.z * 0.1;

                this.prevPos.copy(obj.position);
                this.prevRot.copy(obj.rotation);
            }
        });

        // 🔊 CLICK bật âm thanh (mobile)
        document.addEventListener('click', function () {
            document.querySelectorAll("video").forEach(v => v.muted = false);
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    gesture-detector
>

    <!-- 🎬 VIDEO -->
    <a-assets>
        <video id="vid1" src="assets/asset.mp4" preload="auto" loop playsinline></video>
        <video id="vid2" src="assets/sach1.mp4" preload="auto" loop playsinline></video>
        
        <video id="vid3" src="assets/sach2.mp4" preload="auto" loop playsinline></video>
        <video id="vid4" src="assets/sach3.mp4" preload="auto" loop playsinline></video>
        <video id="vid5" src="assets/sach4.mp4" preload="auto" loop playsinline></video>
        <video id="vid6" src="assets/sach5.mp4" preload="auto" loop playsinline></video>
        
        <!-- thêm video ở đây -->
    </a-assets>

    <!-- 📕 SÁCH CHÍNH -->
    <a-marker
        type="pattern"
        url="assets/marker.patt"
        videohandler
        smooth="true"
        smoothCount="25"
        smoothTolerance="0.004"
        smoothThreshold="10"
    >
        <a-entity anti-shake>
            <a-video src="#vid1" fit-video rotation="-90 0 0"></a-video>
        </a-entity>
    </a-marker>

    <!-- 📗 SÁCH 1 -->
    <a-marker
        type="pattern"
        url="assets/marker1.patt"
        videohandler
        smooth="true"
        smoothCount="25"
        smoothTolerance="0.004"
        smoothThreshold="10"
    >
        <a-entity anti-shake>
            <a-video src="#vid2" fit-video rotation="-90 0 0"></a-video>
        </a-entity>
    </a-marker>

    <!-- 📗 SÁCH 2 -->
    <a-marker url="assets/marker2.patt" videohandler>
        <a-entity anti-shake>
            <a-video src="#vid3" fit-video rotation="-90 0 0"></a-video>
        </a-entity>
    </a-marker>

        <!-- 📗 SÁCH 3 -->
    <a-marker url="assets/marker3.patt" videohandler>
        <a-entity anti-shake>
            <a-video src="#vid4" fit-video rotation="-90 0 0"></a-video>
        </a-entity>
    </a-marker>

            <!-- 📗 SÁCH 4 -->
    <a-marker url="assets/marker4.patt" videohandler>
        <a-entity anti-shake>
            <a-video src="#vid5" fit-video rotation="-90 0 0"></a-video>
        </a-entity>
    </a-marker>

            <!-- 📗 SÁCH 5 -->
    <a-marker url="assets/marker5.patt" videohandler>
        <a-entity anti-shake>
            <a-video src="#vid6" fit-video rotation="-90 0 0"></a-video>
        </a-entity>
    </a-marker>
    

    
    <!-- CAMERA -->
    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
