<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Multi Books PRO</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Gesture -->
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <script>
        // 🎬 VIDEO HANDLER (FIX ÂM THANH)
        AFRAME.registerComponent('videohandler', {
            init: function () {
                const marker = this.el;

                // Khi nhận marker
                marker.addEventListener('markerFound', () => {

                    // ❌ TẮT tất cả video
                    document.querySelectorAll("video").forEach(v => {
                        v.pause();
                        v.currentTime = 0;
                        v.muted = true;
                    });

                    // ✅ BẬT video của marker hiện tại
                    const video = document.querySelector(
                        marker.querySelector('a-video').getAttribute('src')
                    );

                    if (video) {
                        video.currentTime = 0;
                        video.muted = false;
                        video.play().catch(() => {});
                    }
                });

                // Khi mất marker
                marker.addEventListener('markerLost', () => {
                    const video = document.querySelector(
                        marker.querySelector('a-video').getAttribute('src')
                    );

                    if (video) {
                        video.pause();
                        video.muted = true;
                    }
                });
            }
        });

        // 🔥 CHỐNG RUNG
        AFRAME.registerComponent('anti-shake', {
            init: function () {
                this.prevPos = new THREE.Vector3();
                this.prevRot = new THREE.Euler();
            },

            tick: function () {
                const obj = this.el.object3D;

                // mượt vị trí
                obj.position.lerp(this.prevPos, 0.1);

                // mượt rotation
                obj.rotation.x = obj.rotation.x * 0.9 + this.prevRot.x * 0.1;
                obj.rotation.y = obj.rotation.y * 0.9 + this.prevRot.y * 0.1;
                obj.rotation.z = obj.rotation.z * 0.9 + this.prevRot.z * 0.1;

                this.prevPos.copy(obj.position);
                this.prevRot.copy(obj.rotation);
            }
        });

        // 🔊 CLICK 1 LẦN ĐỂ MỞ AUDIO (mobile)
        document.addEventListener('click', function () {
            document.querySelectorAll("video").forEach(v => {
                v.muted = false;
                v.play().catch(() => {});
            });
        });
    </script>
</head>

<body style="margin:0; overflow:hidden;">
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        arjs="sourceType: webcam; facingMode: environment;"
    >

        <!-- VIDEO -->
        <a-assets>
            <video id="vid1" src="assets/asset.mp4" preload="auto" autoplay loop muted playsinline></video>
            <video id="vid2" src="assets/sach1.mp4" preload="auto" autoplay loop muted playsinline></video>
        </a-assets>

        <!-- MARKER -->
        <a-marker type="pattern" url="assets/marker.patt" videohandler smooth="true" smoothCount="20">
            <a-video src="#vid1" rotation="-90 0 0"></a-video>
        </a-marker>

        <a-marker type="pattern" url="assets/marker1.patt" videohandler smooth="true" smoothCount="20">
            <a-video src="#vid2" rotation="-90 0 0"></a-video>
        </a-marker>

        <!-- CAMERA -->
        <a-entity camera></a-entity>

    </a-scene>
</body>
</html>
