<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Multi Books PRO</title>

    <!-- ✅ FIX VERSION -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.js"></script>

    <script>
        // 🎬 VIDEO HANDLER
        AFRAME.registerComponent('videohandler', {
            init: function () {
                const marker = this.el;

                marker.addEventListener('markerFound', () => {
                    const video = document.querySelector(
                        marker.querySelector('a-video').getAttribute('src')
                    );
                    if (video) {
                        video.currentTime = 0;
                        video.play().catch(() => {});
                    }
                });

                marker.addEventListener('markerLost', () => {
                    const video = document.querySelector(
                        marker.querySelector('a-video').getAttribute('src')
                    );
                    if (video) {
                        video.pause();
                    }
                });
            }
        });

        // 📐 FIT VIDEO
        AFRAME.registerComponent('fit-video', {
            init: function () {
                const src = this.el.getAttribute('src');
                const video = document.querySelector(src);
                const el = this.el;

                const setSize = () => {
                    if (video.videoWidth && video.videoHeight) {
                        const ratio = video.videoWidth / video.videoHeight;
                        const width = 1.5;

                        el.setAttribute('width', width);
                        el.setAttribute('height', width / ratio);
                    } else {
                        setTimeout(setSize, 200);
                    }
                };

                setSize();
            }
        });

        // 🔥 FIX AUTOPLAY MOBILE
        document.addEventListener('click', function () {
            document.querySelectorAll("video").forEach(v => {
                v.muted = false;
                v.play().catch(() => {});
            });
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; facingMode: environment;"
>

    <!-- 🎬 VIDEO -->
    <a-assets>
        <video id="vid1" src="assets/asset.mp4" preload="auto" autoplay loop muted playsinline></video>
        <video id="vid2" src="assets/sach1.mp4" preload="auto" autoplay loop muted playsinline></video>
        <video id="vid3" src="assets/sach2.mp4" preload="auto" autoplay loop muted playsinline></video>
        <video id="vid4" src="assets/sach3.mp4" preload="auto" autoplay loop muted playsinline></video>
        <video id="vid5" src="assets/sach4.mp4" preload="auto" autoplay loop muted playsinline></video>
        <video id="vid6" src="assets/sach5.mp4" preload="auto" autoplay loop muted playsinline></video>
    </a-assets>

    <!-- 📕 SÁCH CHÍNH -->
    <a-marker type="pattern" url="assets/marker.patt" videohandler smooth="true" smoothCount="20">
        <a-video src="#vid1" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- 📗 SÁCH 1 -->
    <a-marker type="pattern" url="assets/marker1.patt" videohandler smooth="true" smoothCount="20">
        <a-video src="#vid2" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- 📗 SÁCH 2 -->
    <a-marker type="pattern" url="assets/marker2.patt" videohandler smooth="true" smoothCount="20">
        <a-video src="#vid3" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- 📗 SÁCH 3 -->
    <a-marker type="pattern" url="assets/marker3.patt" videohandler smooth="true" smoothCount="20">
        <a-video src="#vid4" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- 📗 SÁCH 4 -->
    <a-marker type="pattern" url="assets/marker4.patt" videohandler smooth="true" smoothCount="20">
        <a-video src="#vid5" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- 📗 SÁCH 5 -->
    <a-marker type="pattern" url="assets/marker5.patt" videohandler smooth="true" smoothCount="20">
        <a-video src="#vid6" rotation="-90 0 0"></a-video>
    </a-marker>

    <!-- CAMERA -->
    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
