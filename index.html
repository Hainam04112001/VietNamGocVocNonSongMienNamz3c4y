<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Video PRO - Smooth + Sound</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Gesture -->
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

<script>
    // 🎬 VIDEO + ÂM THANH (FIX MULTI VIDEO)
    AFRAME.registerComponent('videohandler', {
        init: function () {
            const marker = this.el;
            this.videoEl = marker.querySelector("a-video");
            this.vid = document.querySelector(this.videoEl.getAttribute("src"));

            marker.addEventListener('markerFound', () => {
                this.vid.muted = false;
                this.vid.play();
            });

            marker.addEventListener('markerLost', () => {
                this.vid.pause();
            });
        }
    });

    // 📐 FIX TỈ LỆ VIDEO (ĐÚNG VIDEO)
    AFRAME.registerComponent('fit-video', {
        init: function () {
            const src = this.el.getAttribute('src');
            const video = document.querySelector(src);
            const el = this.el;

            const setSize = () => {
                const w = video.videoWidth;
                const h = video.videoHeight;

                if (w && h) {
                    const ratio = w / h;
                    const width = 3;

                    el.setAttribute('width', width);
                    el.setAttribute('height', width / ratio);
                } else {
                    setTimeout(setSize, 200);
                }
            };

            setSize();
        }
    });

    // 🔥 CHỐNG RUNG (GIỮ NGUYÊN)
    AFRAME.registerComponent('anti-shake', {
        init: function () {
            this.prevPos = new THREE.Vector3();
            this.prevRot = new THREE.Euler();
        },
        tick: function () {
            const obj = this.el.object3D;

            obj.position.lerp(this.prevPos, 0.1);

            obj.rotation.x = obj.rotation.x * 0.9 + this.prevRot.x * 0.1;
            obj.rotation.y = obj.rotation.y * 0.9 + this.prevRot.y * 0.1;
            obj.rotation.z = obj.rotation.z * 0.9 + this.prevRot.z * 0.1;

            this.prevPos.copy(obj.position);
            this.prevRot.copy(obj.rotation);
        }
    });

    // 🔊 CLICK bật âm thanh (FIX)
    document.addEventListener('click', function () {
        document.querySelectorAll("video").forEach(v => v.muted = false);
    });
</script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    gesture-detector
>

    <!-- VIDEO -->

    <!-- Sách -->

    <a-assets>
        <video id="vid1" src="assets/asset.mp4" loop playsinline></video>
        <video id="vid2" src="assets/sach1.mp4" loop playsinline></video>
    </a-assets>

    
    <!-- MARKER -->
    <!-- Sách Chính -->
    <a-marker url="assets/marker.patt" videohandler>
        <a-video src="#vid1" fit-video rotation="-90 0 0"></a-video>
    </a-marker>

        <!-- 📗 SÁCH 1 -->
    <a-marker url="assets/marker1.patt" videohandler>
        <a-video src="#vid2" fit-video rotation="-90 0 0"></a-video>
    </a-marker>
    

    <!-- CAMERA -->
    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
