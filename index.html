<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Multi Books</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Gesture -->
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <script>
        // 🎬 VIDEO HANDLER (AUTO theo từng marker)
        AFRAME.registerComponent('videohandler', {
            init: function () {
                const marker = this.el;
                this.vid = marker.querySelector("video");

                marker.addEventListener('markerFound', () => {
                    this.vid.muted = false;
                    this.vid.play();
                });

                marker.addEventListener('markerLost', () => {
                    this.vid.pause();
                });
            }
        });

        // 📐 FIX TỈ LỆ VIDEO (KHÔNG BỊ BÓP)
        AFRAME.registerComponent('fit-video', {
            init: function () {
                const src = this.el.getAttribute('src');
                const video = document.querySelector(src);
                const el = this.el;

                const setSize = () => {
                    const w = video.videoWidth;
                    const h = video.videoHeight;

                    if (w && h) {
                        const ratio = w / h;
                        const width = 1.8;

                        el.setAttribute('width', width);
                        el.setAttribute('height', width / ratio);
                    } else {
                        setTimeout(setSize, 200);
                    }
                };

                setSize();
            }
        });

        // 🔊 CLICK bật âm thanh (mobile)
        document.addEventListener('click', function () {
            document.querySelectorAll("video").forEach(v => v.muted = false);
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    gesture-detector
>

    <!-- VIDEO -->
    <a-assets>
        <video id="vid1" src="assets/sach1.mp4" preload="auto" loop playsinline></video>
    </a-assets>

    <!-- 📕 SÁCH 1 -->
    <a-marker
        type="pattern"
        url="assets/marker1.patt"
        videohandler
        smooth="true"
        smoothCount="15"
    >
        <a-video src="#vid1" fit-video rotation="-90 0 0"></a-video>
    </a-marker>


    <!-- CAMERA -->
    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
